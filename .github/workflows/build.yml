name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "app/src/main/assets/answers.json"   # answer-only changes are downloaded by the app, no new APK needed
      - "learned/**"                         # phones' learned answers, no new APK needed
  pull_request:                            # build only (no release) to check that it compiles
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: QuizBot-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as a release (direct download link)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk QuizBot.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" QuizBot.apk --title "QuizBot $TAG" --notes "Built from ${{ github.sha }}" --latest
